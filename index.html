<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Cobrinha Neon</title>
<style>
  :root { --cyan:#0ff; --pink:#f0f; --bg:#07070f; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:system-ui,sans-serif; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; touch-action:none; }
  h1 { margin:0; font-size:1.6rem; letter-spacing:.2em; color:var(--cyan); text-shadow:0 0 12px var(--cyan); }
  .hud { display:flex; gap:28px; font-size:1rem; color:#9ff; }
  .hud b { color:var(--pink); text-shadow:0 0 8px var(--pink); }
  .wrap { position:relative; }
  canvas { width:min(92vw,520px); height:min(92vw,520px); max-height:70vh; max-width:70vh; background:#0b0b1a; border:2px solid var(--cyan); border-radius:10px; box-shadow:0 0 24px var(--cyan), inset 0 0 24px rgba(0,255,255,.15); }
  #msg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(7,7,15,.78); border-radius:10px; text-align:center; cursor:pointer; padding:16px; }
  #msg h2 { margin:0 0 8px; color:var(--pink); text-shadow:0 0 12px var(--pink); }
  #msg p { margin:4px 0; color:#bff; }
  small { color:#789; }
</style>
</head>
<body>
<h1>COBRINHA NEON</h1>
<div class="hud"><span>Pontos: <b id="score">0</b></span><span>Recorde: <b id="best">0</b></span></div>
<div class="wrap">
  <canvas id="c" width="500" height="500"></canvas>
  <div id="msg"><h2>Pronto?</h2><p>Toque ou pressione <b>Espaço</b> para jogar</p><p>Setas / WASD ou deslize na tela</p></div>
</div>
<small>P ou Espaço = pausar</small>
<script>
const N = 20, S = 500 / N;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best'), msg = document.getElementById('msg');
let best = 0;
try { best = +localStorage.getItem('cobrinha-best') || 0; } catch (e) {}
bestEl.textContent = best;

let snake, dir, nextDir, food, score, speed, timer, state = 'idle'; // idle | run | pause | over

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0};
  score = 0; speed = 130;
  scoreEl.textContent = 0;
  placeFood();
}
function placeFood() {
  do { food = {x:Math.random()*N|0, y:Math.random()*N|0}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function start() {
  reset(); state = 'run'; msg.style.display = 'none';
  clearTimeout(timer); loop();
}
function loop() {
  if (state !== 'run') return;
  step(); draw();
  if (state === 'run') timer = setTimeout(loop, speed);
}
function step() {
  dir = nextDir;
  const h = {x:(snake[0].x+dir.x+N)%N, y:(snake[0].y+dir.y+N)%N};
  const eating = h.x === food.x && h.y === food.y;
  const body = eating ? snake : snake.slice(0,-1);
  if (body.some(s => s.x === h.x && s.y === h.y)) return gameOver();
  snake.unshift(h);
  if (eating) {
    score++; scoreEl.textContent = score;
    speed = Math.max(50, speed - 3);
    placeFood();
  } else snake.pop();
}
function gameOver() {
  state = 'over';
  if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('cobrinha-best', best); } catch (e) {} }
  msg.innerHTML = `<h2>Fim de jogo</h2><p>Pontos: ${score}</p><p>Toque ou pressione <b>Espaço</b> para recomeçar</p>`;
  msg.style.display = 'flex';
}
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; ctx.fillStyle = color; }
function draw() {
  ctx.clearRect(0,0,500,500);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(0,255,255,.06)';
  for (let i = 1; i < N; i++) {
    ctx.beginPath(); ctx.moveTo(i*S,0); ctx.lineTo(i*S,500); ctx.moveTo(0,i*S); ctx.lineTo(500,i*S); ctx.stroke();
  }
  glow('#f0f', 18);
  ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S/3, 0, 7); ctx.fill();
  snake.forEach((s,i) => {
    const t = i / snake.length;
    glow(`hsl(${180 - t*60},100%,${60 - t*15}%)`, i === 0 ? 20 : 10);
    ctx.fillRect(s.x*S+2, s.y*S+2, S-4, S-4);
  });
  ctx.shadowBlur = 0;
}
function turn(x, y) {
  if (x === -dir.x && y === -dir.y) return;
  nextDir = {x, y};
}
function togglePause() {
  if (state === 'run') { state = 'pause'; msg.innerHTML = '<h2>Pausado</h2><p>Espaço para continuar</p>'; msg.style.display = 'flex'; }
  else if (state === 'pause') { state = 'run'; msg.style.display = 'none'; loop(); }
}
function action() { state === 'run' || state === 'pause' ? togglePause() : start(); }

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const map = {arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};
  if (map[k]) { e.preventDefault(); if (state === 'idle' || state === 'over') return; turn(...map[k]); }
  else if (k === ' ' || k === 'p') { e.preventDefault(); action(); }
});
msg.addEventListener('click', () => { if (state === 'pause') togglePause(); else if (state !== 'run') start(); });

let tx, ty;
cv.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
cv.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
});

reset(); draw();
</script>
</body>
</html>
